  <desc
     id="desc1">Circular emblem for the International Workshop on Sustainable Software Operations and Development in the Era of AI (SODA). Features a stylized soda can with a leaf pull-tab and an ascending chain of bubble nodes suggesting both carbonation and an AI data network, the bold wordmark SODA, and a laurel-style leaf border.</desc>
